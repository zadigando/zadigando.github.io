<!doctype html>
<html lang="pt-BR" data-mode="motion">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Zadig de Bem — Creative Developer · PoC Orbital</title>
  <meta name="description" content="PoC experimental do portfólio de Zadig de Bem: The Arrival, Contraluz e The Orbital Atlas. Não publicado.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#07080b">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%2307080b%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%274%27 fill=%27%23ffd9a3%27/%3E%3C/svg%3E">
  <link rel="preload" href="/orbital/fonts/archivo-var-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/orbital/fonts/inter-var-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/src/styles/tokens.css">
  <link rel="stylesheet" href="/src/styles/base.css">
  <link rel="stylesheet" href="/src/styles/arrival.css">
  <link rel="stylesheet" href="/src/styles/atlas.css">
  <link rel="stylesheet" href="/src/styles/origin.css">
  <link rel="stylesheet" href="/src/styles/world.css">
  <link rel="stylesheet" href="/src/styles/static.css">
</head>
<body>
  <a class="skip-link" href="#atlas" data-i18n="skip">Pular para os mundos</a>
  <div class="grain" aria-hidden="true"></div>

  <header class="hdr" id="hdr">
    <a class="brand meta" href="#arrival"><b data-i18n="brand">Zadig de Bem</b><span class="role" data-i18n="role">Creative Developer</span></a>
    <nav class="meta" aria-label="Capítulos">
      <a href="#atlas" data-i18n="navWorlds" data-chapter="atlas">Mundos</a>
      <a href="#origin" data-i18n="navOrigin" data-chapter="origin">Origem</a>
      <a href="#connection" data-i18n="navContact" data-chapter="connection">Contato</a>
    </nav>
    <div class="tools">
      <div class="lang meta" role="group" data-i18n-attr="aria-label:langLabel">
        <button type="button" data-lang="pt" lang="pt-BR" aria-label="Português" aria-pressed="true">PT</button><span>/</span><button type="button" data-lang="en" lang="en" aria-label="English" aria-pressed="false">EN</button>
      </div>
    </div>
  </header>

  <main id="main">
    <!-- ===== Capítulo 01 · The Arrival (Contraluz) ===== -->
    <section id="arrival" class="track track--arrival" aria-labelledby="name-title">
      <div class="stage">
        <svg class="name" id="name" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="name-title">
          <title id="name-title">Zadig de Bem</title>
          <defs>
            <radialGradient id="g-warm" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="1">
              <stop offset="0" stop-color="#ffd9a3" stop-opacity="0.62"/>
              <stop offset="0.28" stop-color="#ffb870" stop-opacity="0.17"/>
              <stop offset="1" stop-color="#07080b" stop-opacity="0"/>
            </radialGradient>
            <linearGradient id="g-sheen" gradientUnits="objectBoundingBox" x1="0" y1="0" x2="1" y2="0.2">
              <stop offset="0" stop-color="#f1ece2"/>
              <stop offset="0.46" stop-color="#f1ece2"/>
              <stop offset="0.5" stop-color="#fff8ea"/>
              <stop offset="0.54" stop-color="#f1ece2"/>
              <stop offset="1" stop-color="#f1ece2"/>
            </linearGradient>
            <clipPath id="c-window"><rect id="c-rect" x="0" y="0" width="0" height="0"/></clipPath>
          </defs>
          <rect class="name-bg" x="0" y="0" width="100%" height="100%" fill="#07080b"/>
          <circle id="glow" r="1" fill="url(#g-warm)" opacity="0"/>
          <image id="window" preserveAspectRatio="none" clip-path="url(#c-window)" opacity="0"/>
          <g id="name-text"></g>
        </svg>

        <div class="arrival-ui">
          <p class="arrival-hint meta" aria-hidden="true" data-i18n="arrivalHint">Role para atravessar</p>
        </div>
      </div>
    </section>

    <!-- ===== Capítulo 02 · The Orbital Atlas ===== -->
    <section id="atlas" class="track track--atlas" aria-labelledby="atlas-title" tabindex="-1">
      <div class="stage">
        <div class="numeral" id="numeral" aria-hidden="true"><span></span><span></span></div>
        <svg class="orbit" id="orbit" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-hidden="true"></svg>
        <div class="surfaces" id="surfaces"></div>
        <div class="column" id="column">
          <p class="meta column-index"><b id="column-index">01 / 04</b></p>
          <h2 class="column-title" id="atlas-title"></h2>
          <p class="column-cat" id="column-cat"></p>
          <p class="column-thesis" id="column-thesis"></p>
          <div class="column-acts">
            <a class="cta" id="visit" href="#" target="_blank" rel="noreferrer"><span data-i18n="atlasVisit">Visitar site</span><i class="ext" aria-hidden="true">↗</i></a>
            <button class="cta" type="button" id="enter" hidden><span data-i18n="atlasEnter">Entrar no mundo</span><i aria-hidden="true"></i></button>
          </div>
        </div>
        <nav class="index" id="index" data-i18n-attr="aria-label:atlasOrbitLabel"></nav>
      </div>
    </section>

    <!-- ===== Capítulo 03 · The Origin · Estudo 01 (Escorpião) ===== -->
    <section id="origin" class="track track--origin" aria-labelledby="origin-title" tabindex="-1">
      <div class="stage">
        <div class="numeral numeral--origin" id="origin-numeral" aria-hidden="true"><span>2020</span></div>
        <svg class="sky" id="sky" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sky-title sky-desc">
          <title id="sky-title" data-i18n="skyTitle">Constelação de Escorpião</title>
          <desc id="sky-desc" data-i18n="skyDesc"></desc>
          <defs>
            <radialGradient id="g-warm-sky">
              <stop offset="0" stop-color="#ffd9a3" stop-opacity="0.55"/>
              <stop offset="0.35" stop-color="#ffb870" stop-opacity="0.16"/>
              <stop offset="1" stop-color="#ffb870" stop-opacity="0"/>
            </radialGradient>
          </defs>
        </svg>
        <div class="column column--origin" id="origin-column">
          <p class="meta column-index"><b>2020</b><span data-i18n="originMark">primeiro marco</span><span class="column-star">· Antares</span></p>
          <h2 class="column-title" id="origin-title" data-i18n="originTitle">A história da internet</h2>
          <p class="column-cat" data-i18n="originCat"></p>
          <p class="column-thesis" data-i18n="originThesis"></p>
        </div>
      </div>
    </section>

  </main>

    <!-- ===== Mundo expandido (diálogo) ===== -->
    <div class="world" id="world" role="dialog" aria-modal="true" aria-labelledby="world-title" hidden>
      <div class="world-scrim"></div>
      <div class="world-body">
        <div class="world-media" id="world-media">
          <video id="world-video" muted loop playsinline preload="none"></video>
          <img id="world-poster" alt="">
        </div>
        <p class="world-notice meta" id="world-notice"></p>
        <div class="world-text">
          <p class="meta" id="world-eyebrow"></p>
          <div class="world-left">
            <h2 class="world-title" id="world-title"></h2>
            <p class="world-cat" id="world-cat"></p>
          </div>
          <div class="world-right">
            <p class="meta world-k" data-i18n="worldThesis">Tese do case</p>
            <p class="world-thesis" id="world-thesis"></p>
            <p class="meta world-k" data-i18n="worldStatus">Estado</p>
            <p class="world-status" id="world-status"></p>
            <div class="world-acts">
              <a class="cta cta--solid" id="world-visit" href="#" target="_blank" rel="noreferrer"><span data-i18n="atlasVisit">Visitar site</span><i aria-hidden="true"></i></a>
            </div>
          </div>
        </div>
        <button class="world-close" type="button" id="world-close"><span class="meta" data-i18n="worldClose">Voltar ao atlas</span> <kbd aria-hidden="true">Esc</kbd></button>
        <button class="world-peek" type="button" id="world-next"><span></span></button>
      </div>
    </div>

  <footer class="foot" id="connection">
    <p class="next" data-i18n-html="footNext"></p>
    <div class="links meta">
      <a class="link" href="https://www.linkedin.com/in/zadig-de-bem-b21a581b3/" target="_blank" rel="noreferrer" data-i18n="footLinkedIn">LinkedIn</a>
      <a class="link" href="https://github.com/zadigando" target="_blank" rel="noreferrer" data-i18n="footGitHub">GitHub</a>
      <a class="link" href="https://wa.me/16991079105" target="_blank" rel="noreferrer" data-i18n="footWhats">WhatsApp</a>
    </div>
  </footer>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
